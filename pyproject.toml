[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "retryable-requests"
description = "A requests session with sensible retries and timeouts built in."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "Kitware, Inc.", email = "kitware@kitware.com" }]
keywords = [
  "resonant",
  "kitware-resonant",
  "requests",
  "retry",
  "retryable",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  # The first version that provides built-in types
  "requests>=2.34",
  # The first version with "Retry.retry_after_max"
  "urllib3>=2.6.3",
  # The first version with "Sentinel" (PEP 661), a builtin as "sentinel" from Python 3.15
  "typing-extensions>=4.14; python_version < '3.15'",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/kitware-resonant/retryable-requests"
"Bug Reports" = "https://github.com/kitware-resonant/retryable-requests/issues"

[dependency-groups]
dev = [
  "tox",
  "tox-uv",
]
lint = [
  "ruff",
]
type = [
  "mypy",
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-httpserver",
  "pytest-mock",
  "trustme",
  "werkzeug",
]

[tool.hatch.build]
only-include = [
  "retryable_requests",
]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Incompatible with formatter
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
  "D206", # docstring-tab-indentation
  "D300", # triple-single-quotes
  "E111", # indentation-with-invalid-multiple
  "E114", # indentation-with-invalid-multiple-comment
  "E117", # over-indented
  "ISC001", # single-line-implicit-string-concatenation
  "ISC002", # multi-line-implicit-string-concatenation
  "Q", # flake8-quotes
  "W191", # tab-indentation

  # Incompatible with Django
  "A003", # builtin-attribute-shadowing
  "ARG001", # unused-function-argument
  "ARG002", # unused-method-argument
  "RUF012", # mutable-class-default

  # Overly burdensome
  "ANN", # flake8-annotations
  "CPY001", # missing-copyright-notice
  "D1", # undocumented-*
  "EM", # flake8-errmsg
  "ERA001", # commented-out-code
  "FIX", # flake8-fixme
  "RET505", # superfluous-else-return
  "RET506", # superfluous-else-raise
  "RET507", # superfluous-else-continue
  "RET508", # superfluous-else-break
  "TD002", # missing-todo-author
  "TD003", # missing-todo-link
  "TRY003", # raise-vanilla-args

  # Project-specific
]

[tool.ruff.lint.per-file-ignores]
"dev/**" = [
  "INP001", # implicit-namespace-package
]
"**/tests/**" = [
  "DJ007", # django-all-with-model-form
  "DJ008", # django-model-without-dunder-str
  "INP001", # implicit-namespace-package
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments
  "PLR2004", # magic-value-comparison
  "S", # flake8-bandit
  "SLF001", # private-member-access
]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["pydantic.Field", "django.db.models.Value"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["ninja.Query"]

[tool.ruff.lint.flake8-self]
extend-ignore-names = ["_base_manager", "_default_manager",  "_meta"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.isort]
# Sort by name, don't cluster "from" vs "import"
force-sort-within-sections = true
# Deferred annotations allows TC* rules to move more imports into TYPE_CHECKING blocks
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
files = [
  "retryable_requests",
  "tests",
]
strict = true
warn_unused_configs = true
enable_error_code = ["exhaustive-match"]
mypy_path = [
  # Use the same pythonpath for MyPy as for Pytest
  "tests",
]

[[tool.mypy.overrides]]
module = [
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Allow test utility modules to be imported without adding the root directory to the pythonpath,
# which would cause the local "retryable_requests" module to shadow the install.
pythonpath = ["tests"]
strict = true
addopts = [
  # Use the Pytest-recommended "importlib" mode
  "--import-mode=importlib",
  "--showlocals",
  "--cov",
]
filterwarnings = [
  "error",
  # pytest often causes unclosed socket warnings
  'ignore:unclosed <socket\.socket:ResourceWarning',
]

[tool.coverage.run]
source_pkgs = [
  "retryable_requests",
]

[tool.coverage.paths]
source = [
  "retryable_requests/",
  ".tox/**/site-packages/retryable_requests/",
]
